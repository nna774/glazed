syntax = "proto3";

package glazed.v1;

import "glazed/v1/secret.proto";
import "google/protobuf/any.proto";

option ruby_package = "Glazed::Proto::V1";

// Where configuration files are stored.
message StorageConfig {
  // Storage implementation and its settings.
  oneof backend {
    // Local git repository.
    GitStorage git = 1;
    // GitHub repository, written through the API.
    GithubStorage github = 2;
    // Amazon S3 bucket, provided by the glazed-aws gem.
    S3Storage s3 = 3;
    // Local directory holding the latest content only.
    FilesystemStorage filesystem = 4;
    // Storage implemented outside glazed, selected by the settings message type.
    google.protobuf.Any plugin = 5;
  }
}

// Local directory. Each key is a file under the path, overwritten in place;
// use git or S3 storage when history matters.
message FilesystemStorage {
  // Directory holding the files. It is created when missing.
  string path = 1;
}

// Local git repository, committed to on each write.
message GitStorage {
  // Path of the working tree. A repository is initialised when missing.
  string path = 1;
  // Branch to commit to. "main" is used when empty.
  string branch = 2;
  // Remote name or URL. When set, the branch is pulled before and pushed after each commit.
  string remote = 3;
  // Commit author name. "glazed" is used when empty.
  string author_name = 4;
  // Commit author email. "glazed@localhost" is used when empty.
  string author_email = 5;
}

// GitHub repository written through the Git Data API, one commit per write.
message GithubStorage {
  // Repository as "owner/name".
  string repository = 1;
  // Branch to commit to. It is created from base_branch when missing.
  string branch = 2;
  // Branch to start a missing branch from. The repository default branch is used when empty.
  string base_branch = 3;
  // Token with contents write permission.
  SecretRef token = 4;
  // API endpoint. "https://api.github.com" is used when empty.
  string api_url = 5;
  // Commit author name. The token owner is used when empty.
  string author_name = 6;
  // Commit author email. The token owner is used when empty.
  string author_email = 7;
}

// Amazon S3 bucket. Enable bucket versioning to keep history.
message S3Storage {
  // Bucket name.
  string bucket = 1;
  // Prefix prepended to every key, such as "raw/".
  string prefix = 2;
  // Bucket region. The SDK default region is used when empty.
  string region = 3;
}

// Location of one stored file.
message Pointer {
  // Storage-specific location.
  oneof location {
    // File in a git repository.
    GitLocation git = 1;
    // File in a GitHub repository.
    GithubLocation github = 2;
    // Object in an Amazon S3 bucket.
    S3Location s3 = 3;
    // File in a local directory.
    FilesystemLocation filesystem = 4;
    // Location in a storage implemented outside glazed.
    google.protobuf.Any plugin = 5;
  }
}

// File at a commit of a git repository.
message GitLocation {
  // Path of the file within the repository.
  string path = 1;
  // Commit holding the file content.
  string commit = 2;
}

// File at a commit of a GitHub repository.
message GithubLocation {
  // Repository as "owner/name".
  string repository = 1;
  // Path of the file within the repository.
  string path = 2;
  // Commit holding the file content.
  string commit = 3;
}

// Version of an object in an Amazon S3 bucket.
message S3Location {
  // Bucket name.
  string bucket = 1;
  // Object key, including the storage prefix.
  string key = 2;
  // Object version. Empty when the bucket is not versioned, meaning the latest content.
  string version_id = 3;
}

// File in a local directory, as written.
message FilesystemLocation {
  // Path of the file within the directory.
  string path = 1;
  // Hex SHA-256 of the content written. Reading fails once the file holds other content.
  string sha256 = 2;
}

syntax = "proto3";

package glazed.v1;

import "glazed/v1/inventory.proto";
import "glazed/v1/storage.proto";

option ruby_package = "Glazed::Proto::V1";

// Stored content produced by a step.
message Artifact {
  // Storage holding the content, by name in Config.storages.
  string storage = 1;
  // Location within that storage.
  Pointer pointer = 2;
}

// A node and the artifacts produced for it so far. Input and output of per-node steps.
message NodeState {
  // The node.
  Node node = 1;
  // Artifacts by name.
  map<string, Artifact> artifacts = 2;
}

// Every node that reached a batch step. Input and output of batch steps.
message BatchState {
  // Node states in inventory order.
  repeated NodeState nodes = 1;
}

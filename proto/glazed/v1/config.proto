syntax = "proto3";

package glazed.v1;

import "glazed/v1/inventory.proto";
import "glazed/v1/storage.proto";
import "glazed/v1/workflow.proto";

option ruby_package = "Glazed::Proto::V1";

// Settings of the glazed command. Relative paths are resolved from the current directory.
message Config {
  // Sources of nodes. Node names must be unique across all of them.
  repeated InventorySource inventory = 1;
  // Storages by name, referred to by workflow steps.
  map<string, StorageConfig> storages = 2;
  // Workflows by name.
  map<string, Workflow> workflows = 3;
  // Nodes processed in parallel by the glazed command. 4 is used when 0.
  uint32 jobs = 4;
}

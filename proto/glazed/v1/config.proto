syntax = "proto3";

package glazed.v1;

import "buf/validate/validate.proto";
import "glazed/v1/inventory.proto";
import "glazed/v1/orchestrator.proto";
import "glazed/v1/redaction.proto";
import "glazed/v1/storage.proto";
import "glazed/v1/workflow.proto";

option ruby_package = "Glazed::Proto::V1";

// Settings of the glazed command. Relative paths are resolved from the current directory.
message Config {
  // Sources of nodes. Node names must be unique across all of them.
  repeated InventorySource inventory = 1;
  // Storages by name, referred to by workflow steps.
  map<string, StorageConfig> storages = 2 [(buf.validate.field).map.keys.string.min_len = 1];
  // Workflows by name.
  map<string, Workflow> workflows = 3 [(buf.validate.field).map.keys.string.min_len = 1];
  // Nodes processed in parallel by the glazed command. 4 is used when 0.
  uint32 jobs = 4;
  // Ruby features required before the rest of the config is decoded, so that
  // plugin gems register the message types their plugin settings use.
  repeated string requires = 5 [(buf.validate.field).repeated.items.string.min_len = 1];
  // Settings of `glazed orchestrate`.
  Orchestrator orchestrator = 6;
  // Redaction settings shared by every redact step. A step's mode and hmac_key
  // take precedence when set, and secrets of both apply.
  Redaction redaction = 7;
}

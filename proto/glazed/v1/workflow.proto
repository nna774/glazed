syntax = "proto3";

package glazed.v1;

import "buf/validate/validate.proto";
import "glazed/v1/redaction.proto";
import "google/protobuf/any.proto";

option ruby_package = "Glazed::Proto::V1";

// Ordered steps run against the selected nodes. Consecutive per-node steps run
// for each node independently; a batch step runs once with every node that
// completed the steps before it.
message Workflow {
  option (buf.validate.message).cel = {
    id: "workflow.unique_step_names"
    message: "step names must be unique"
    expression: "this.steps.map(s, s.name).unique()"
  };
  // Steps in order.
  repeated Step steps = 1 [(buf.validate.field).repeated.min_items = 1];
}

// One unit of a workflow, rendered as one state by an orchestrator. Steps are
// looked up by the oneof case name, so another gem can implement one added here
// as glazed/steps/<name>.
message Step {
  // Name unique within the workflow.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // What the step does.
  oneof action {
    option (buf.validate.oneof).required = true;
    // Per node: collect the configuration.
    FetchStep fetch = 2;
    // Per node: hide secrets in an artifact.
    RedactStep redact = 3;
    // Batch: write an artifact of every node in one change.
    PublishStep publish = 4;
    // Per node: run a command.
    CommandStep command = 5;
    // Batch: run a command once with every node's state.
    BatchCommandStep batch_command = 6;
    // Step implemented outside glazed, selected by the settings message type.
    google.protobuf.Any plugin = 7;
  }
}

// Per node: collects the node's configuration and stores it as an artifact.
message FetchStep {
  // Name of the artifact to produce.
  string output = 1 [(buf.validate.field).string.min_len = 1];
  // Storage to write the artifact to, by name in Config.storages.
  string storage = 2 [(buf.validate.field).string.min_len = 1];
  // Seconds to wait for each expected device output. 60 is used when 0.
  uint32 timeout_seconds = 3;
}

// Per node: hides secrets in an artifact using the node dialect's sensitive patterns.
message RedactStep {
  // Name of the artifact to read.
  string input = 1 [(buf.validate.field).string.min_len = 1];
  // Name of the artifact to produce.
  string output = 2 [(buf.validate.field).string.min_len = 1];
  // Storage to write the artifact to, by name in Config.storages.
  string storage = 3 [(buf.validate.field).string.min_len = 1];
  // How secrets are hidden.
  Redaction redaction = 4;
}

// Batch: writes an artifact of every node into a storage as one change, such as one commit.
message PublishStep {
  // Name of the artifact to read.
  string input = 1 [(buf.validate.field).string.min_len = 1];
  // Storage to write to, by name in Config.storages.
  string storage = 2 [(buf.validate.field).string.min_len = 1];
  // Name of the artifact recording the written locations. Nothing is recorded when empty.
  string output = 3;
}

// Per node: runs a command line with /bin/sh -c, or a program with exec. The
// input artifact's content is on stdin and stdout becomes the output
// artifact; both are optional. GLAZED_STEP, GLAZED_NODE_NAME,
// GLAZED_NODE_GROUP, GLAZED_NODE_DIALECT, GLAZED_NODE_HOST and GLAZED_NODE
// (the node as ProtoJSON, secrets unresolved) are set. A non-zero exit fails
// the node.
message CommandStep {
  option (buf.validate.message).cel = {
    id: "command_step.output_storage"
    message: "output and storage go together"
    expression: "(this.output == '') == (this.storage == '')"
  };
  option (buf.validate.message).oneof = {
    fields: [
      "run",
      "exec"
    ]
    required: true
  };
  // Command line, run by /bin/sh -c.
  string run = 1;
  // Name of the artifact whose content is written to stdin. stdin is empty when unset.
  string input = 2;
  // Name of the artifact to produce from stdout. stdout is discarded when unset.
  string output = 3;
  // Storage to write the output to, by name in Config.storages. Required with output.
  string storage = 4;
  // Seconds before the command is killed. 300 is used when 0.
  uint32 timeout_seconds = 5;
  // Program and its arguments, executed without a shell.
  repeated string exec = 6 [(buf.validate.field).repeated.items.string.min_len = 1];
}

// Batch: runs a command line with /bin/sh -c, or a program with exec, once
// with the BatchState of every node that got this far as ProtoJSON on stdin
// and GLAZED_STEP set. A non-zero exit fails the run.
message BatchCommandStep {
  option (buf.validate.message).oneof = {
    fields: [
      "run",
      "exec"
    ]
    required: true
  };
  // Command line, run by /bin/sh -c.
  string run = 1;
  // Seconds before the command is killed. 300 is used when 0.
  uint32 timeout_seconds = 2;
  // Program and its arguments, executed without a shell.
  repeated string exec = 3 [(buf.validate.field).repeated.items.string.min_len = 1];
}

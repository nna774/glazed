syntax = "proto3";

package glazed.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";

option ruby_package = "Glazed::Proto::V1";

// Reference to a secret value, resolved only when it is used.
message SecretRef {
  // Where the secret value comes from.
  oneof source {
    option (buf.validate.oneof).required = true;
    // Literal value.
    string value = 1;
    // Name of an environment variable holding the value.
    string env = 2 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*$"];
    // Path of a file holding the value. One trailing newline is removed.
    string file = 3 [(buf.validate.field).string.min_len = 1];
    // Source implemented outside glazed, selected by the settings message type.
    google.protobuf.Any plugin = 4;
  }
}

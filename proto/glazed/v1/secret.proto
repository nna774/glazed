syntax = "proto3";

package glazed.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";

option ruby_package = "Glazed::Proto::V1";

// Reference to a secret value, resolved only when it is used.
message SecretRef {
  // Where the secret value comes from.
  oneof source {
    option (buf.validate.oneof).required = true;
    // Literal value.
    string value = 1;
    // Name of an environment variable holding the value.
    string env = 2 [(buf.validate.field).string.pattern = "^[A-Za-z_][A-Za-z0-9_]*$"];
    // Path of a file holding the value. One trailing newline is removed.
    string file = 3 [(buf.validate.field).string.min_len = 1];
    // Source implemented outside glazed, selected by the settings message type.
    google.protobuf.Any plugin = 4;
    // AWS Systems Manager Parameter Store parameter, provided by the glazed-aws gem.
    SsmParameter ssm = 5;
    // Command printing the value.
    CommandSecret command = 6;
  }
}

// AWS Systems Manager Parameter Store parameter, decrypted when it is a
// SecureString. The value is fetched on first use and kept for cache
// by whatever holds the reference, such as a warm Lambda function.
message SsmParameter {
  // Name or ARN of the parameter, optionally with a ":version" or ":label" selector.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Region of the parameter. The SDK default is used when empty.
  string region = 2;
  // How long a fetched value is reused before fetching it again. 300s is used when unset or 0.
  google.protobuf.Duration cache = 4 [(buf.validate.field).duration.gte = {}];
  reserved 3;
  reserved "cache_seconds";
}

// Command printing a secret value on stdout, such as a password manager's CLI.
// It runs with empty stdin each time the value is read, and a non-zero exit
// makes the value unavailable. One trailing newline is removed.
message CommandSecret {
  option (buf.validate.message).oneof = {
    fields: [
      "run",
      "exec"
    ]
    required: true
  };
  // Command line, run by /bin/sh -c.
  string run = 1;
  // How long before the command is killed. 30s is used when unset or 0.
  google.protobuf.Duration timeout = 4 [(buf.validate.field).duration.gte = {}];
  // Program and its arguments, executed without a shell.
  repeated string exec = 3 [(buf.validate.field).repeated.items.string.min_len = 1];
  reserved 2;
  reserved "timeout_seconds";
}

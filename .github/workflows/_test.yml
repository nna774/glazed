name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rspec:
    name: ${{ matrix.gem }} rspec (${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gem: [glazed, glazed-aws]
        ruby: ['3.4', '4.0']
        include:
          # Ruby::Box, which loads Oxidized models, is new in Ruby 4.0.
          - gem: glazed-oxidized
            ruby: '4.0'
            ruby_box: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
        working-directory: ${{ matrix.gem }}
        env:
          RUBY_BOX: ${{ matrix.ruby_box }}

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # RuboCop, SPDX headers, Sorbet, YARD coverage, buf lint and format, workflows.
      - run: hk check --all

  buf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Provides buf and the protoc whose built-in ruby plugin buf.gen.yaml uses.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: buf breaking --against '.git#branch=origin/main'
        if: github.event_name == 'pull_request'
      - name: Check generated code is current
        run: |
          buf generate
          git diff --exit-code

name: lambda-image

on:
  workflow_call:
    inputs:
      tags:
        description: Tags of ghcr.io/<owner>/glazed-lambda to push, comma-separated
        type: string
        required: true
      cache:
        description: Use the GitHub Actions cache for build layers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image references
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          TAGS: ${{ inputs.tags }}
        run: |
          repository="ghcr.io/${OWNER,,}/glazed-lambda"
          refs=""
          IFS=',' read -ra tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            refs="${refs:+${refs},}${repository}:${tag}"
          done
          echo "tags=${refs}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: glazed-aws/lambda/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: ${{ inputs.cache && 'type=gha' || '' }}
          cache-to: ${{ inputs.cache && 'type=gha,mode=max' || '' }}

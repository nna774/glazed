# Hand-written from the AireOS command reference; not a device capture.
init_prompt: |-
  \r\n(Cisco Controller)\r\nUser:\x20
commands:
  admin: |-
    admin
    Password:
  pw: |-

    (Cisco Controller) >
  config paging disable: |-
    config paging disable

    (Cisco Controller) >
  show udi: |-
    show udi

    Name:\"Chassis\"   , DESCR:\"Cisco Wireless Controller\"
    PID:AIR-CT2504-K9, VID:V06, SN:PSZ12345678

    (Cisco Controller) >
  show boot: |-
    show boot

    Primary Boot Image............................... 8.10.190.0 (default) (active)
    Backup Boot Image................................ 8.5.182.0

    (Cisco Controller) >
  show run-config commands: |-
    show run-config commands

    config sysname wlc1
    config snmp community create campuscomm
    config radius auth add 1 192.0.2.10 1812 ascii radiussecret
    config wlan create 1 corp corp
    config wlan security wpa akm psk set-key ascii wlanpsk123 1
    rogue client alert 00:11:22:33:44:55
    config wlan enable 1

    (Cisco Controller) >
  logout: |-
    logout

    The system has unsaved changes.
    Would you like to save them now? (y/N)\x20
secrets:
  - campuscomm
  - radiussecret
  - wlanpsk123
